[tool.black]
skip-magic-trailing-comma = true


[build-system]
requires = ["setuptools>=80", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepSDFStruct"
dynamic = ["version"]
description = "Deep Implicit Lattice Geometry"
authors = [
    { name = "Michael Kofler", email = "michael.kofler@tuwien.ac.at" }
]
requires-python = ">=3.10"


dependencies = [
    "plyfile",
    "scikit-image",
    "trimesh",
    "matplotlib",
    "gustaf",
    "splinepy>=0.2.1",
    "vedo",
    "libigl",
    "embreex; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "tetgenpy",
    "meshio",
    "numba",
    "napf",
    "mmapy",
    "torch",
    "torchvision",
    "torchaudio",
    "pytest>=8.3.5",
    "huggingface-hub>=0.33.2",
    "pytest-cov>=5.0.0",
    "triangle>=20250106",
    "vtk>=9.5.1",
    "torch-fem>=0.4.5,<=0.5.0",
    "numpy>=2.0.0",
    # Both are imported unconditionally (pandas in deep_sdf/plotting.py, scipy in
    # deep_sdf/metrics/mesh_to_analytical.py) and until now only resolved as
    # transitive dependencies of mlflow / scikit-image.
    "pandas",
    "scipy",
    "mlflow>=3.10.1",
    "onnx>=1.20.1",
    "pyvista",
    "tqdm"
]

[tool.setuptools_scm]

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-autodoc-typehints",
]
visualization = [
    "streamlit>=1.55.0",
    "streamlit-stl>=0.0.6",
    "scikit-learn",
]
computation = [
    "pypardiso>=0.4.6; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
quantum = [
    "pennylane>=0.40.0",
    "pennylane-lightning>=0.40.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = true

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing"]
source = ["DeepSDFStruct"]
